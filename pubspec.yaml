name: growupmore
description: "Grow Up More — multilingual IT-skilling Flutter app for Android + iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # ── Core UI ──────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6     # kept for the curvy bottom-bar option;
                                    # the custom BNBCustomePainter still uses
                                    # the same shape — this dep is here so
                                    # we can swap in later if needed.
  flutter_svg: ^2.0.10+1             # GM_Logo_Dark.svg renderer

  # ── Typography — match desktop's `next/font/google` setup ────────────
  # Sora for headings · Outfit for body. Loaded at runtime; we cap to the
  # weights actually used to keep binary size small.
  google_fonts: ^6.2.1

  # ── Premium interaction layer ────────────────────────────────────────
  # Used for the shimmer-skeleton loading state and the entrance-animation
  # micro-interactions that make the home screen feel alive.
  shimmer:         ^3.0.0
  flutter_animate: ^4.5.0

  # ── Networking + state + persistence (i18n / categories) ─────────────
  # Mirrors the gum_web architecture: HTTP via dio, state via plain
  # ChangeNotifier through provider, language ISO persisted to
  # SharedPreferences (key `gum_flutter.lang`).
  #
  # Note: `provider` is kept for the LanguageController + CategoriesController
  # legacy plumbing. New work (auth + profile) uses `flutter_bloc` instead.
  dio:                ^5.7.0
  provider:           ^6.1.2
  shared_preferences: ^2.3.2

  # ── Auth + profile (Phase A foundation) ──────────────────────────────
  # Enterprise-grade state with explicit events and immutable states.
  # `equatable` powers cheap state equality checks so BlocBuilder/Listener
  # only rebuilds when something meaningful changed.
  flutter_bloc:           ^8.1.6
  bloc:                   ^8.1.4
  equatable:              ^2.0.5

  # Secure on-device storage for tokens (Keychain on iOS, EncryptedSharedPrefs
  # on Android). Replaces localStorage from the web client.
  flutter_secure_storage: ^9.2.2

  # Declarative routing with an auth-gate redirect. The MaterialApp.router
  # entry replaces the old `home: SplashScreen()` setup.
  go_router:              ^14.6.1

  # Profile uploads — image_picker for avatar / education certificate
  # photos, file_picker for PDF documents.
  image_picker:           ^1.1.2
  file_picker:            ^8.1.4

  # MediaType helper for setting the multipart Content-Type on uploads.
  # Available transitively via dio but declared explicitly here to
  # satisfy `depend_on_referenced_packages` and survive dio bumps.
  http_parser:            ^4.0.2

  # Date formatting + parsing (start_date / end_date inputs across
  # education, experience, projects).
  intl:                   ^0.19.0

  # PKCE / hash helpers — keeps the door open for OAuth flows later.
  crypto:                 ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Asset roots. `assets/` keeps the legacy flat list (already 40+ images
  # used by the original home screen); `assets/images/` is where the
  # SVG brand mark and any future SVG/vector art lives so the typed
  # `core/constants/app_assets.dart` stays predictable.
  assets:
    - assets/
    - assets/images/
